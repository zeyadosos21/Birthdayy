<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#fffaf6">
  <script>
    // Do not allow direct access before the 4-digit vault is unlocked.
    if (sessionStorage.getItem("birthdayUnlocked") !== "yes") {
      window.location.replace("index.html");
    }
  </script>
  <title>Notes • Malookkyyy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script>
</head>
<body data-page="notes">
  <div id="passwordGate" class="password-gate"><section class="lock-card"><div class="lock-symbol" aria-hidden="true"></div><p class="lock-eyebrow">A little private vault</p><h1 class="lock-title">A LITTLE<br>PRIVATE VAULT</h1><p class="lock-name">For Malookkyyy</p><p class="lock-copy">One password, then the whole birthday memory book is yours.</p><div class="pin-row"><input class="pin-digit" aria-label="Digit 1" inputmode="numeric" maxlength="1"><input class="pin-digit" aria-label="Digit 2" inputmode="numeric" maxlength="1"><input class="pin-digit" aria-label="Digit 3" inputmode="numeric" maxlength="1"><input class="pin-digit" aria-label="Digit 4" inputmode="numeric" maxlength="1"></div><button id="unlockBtn" class="unlock-button" type="button">Submit</button><div id="gateStatus" class="gate-status"></div><p class="lock-quote">Some memories are just more special</p></section></div>

  <div id="siteApp" class="site-shell hidden">
    <main class="page page-narrow">
      <h1 class="page-title">Notes</h1>
      <p class="page-subtitle">Small things make big moments.</p>

      <div class="notes-tabs" role="tablist" aria-label="Notes sections">
        <button class="notes-tab active" data-notes-tab="todo" type="button">To Do List</button>
        <button class="notes-tab" data-notes-tab="songs" type="button">Wedding Songs</button>
      </div>

      <section class="shared-panel" data-notes-panel="todo">
        <form id="todoForm" class="shared-form">
          <input id="todoInput" class="shared-input" maxlength="180" placeholder="Add a new to do…" aria-label="New to do" required>
          <button class="add-round" type="submit" aria-label="Add to do">+</button>
        </form>
        <div id="todoStatus" class="form-status"></div>
        <div id="todoList" class="shared-list"></div>
      </section>

      <section class="shared-panel hidden" data-notes-panel="songs">
        <form id="songForm" class="shared-form">
          <!-- WEDDING SONGS: visitors only type the song name here -->
          <input id="songInput" class="shared-input" maxlength="180" placeholder="Song name" aria-label="Song name" required>
          <button class="add-round" type="submit" aria-label="Add song">+</button>
        </form>
        <div id="songStatus" class="form-status"></div>
        <div id="songList" class="shared-list"></div>
      </section>

      <details class="owner-box">
        <summary>Owner controls</summary>
        <form id="adminForm" class="owner-form">
          <input id="adminEmail" class="shared-input" type="email" autocomplete="username" placeholder="Owner email" required>
          <input id="adminPassword" class="shared-input" type="password" autocomplete="current-password" placeholder="Owner password" required>
          <button class="owner-button" type="submit">Log in</button>
        </form>
        <button id="adminLogout" class="owner-button hidden" type="button" style="margin-top:10px">Log out</button>
        <div id="adminStatus" class="form-status"></div>
      </details>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation"><div class="bottom-nav-inner">
      <a class="nav-link" data-nav="home" href="index.html"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a class="nav-link" data-nav="gallery" href="gallery.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4.5 17 5-5 3.5 3 2.5-2.5 4 4.5"/></svg><span>Gallery</span></a>
      <a class="nav-link" data-nav="memories" href="memories.html"><span class="memory-heart">♥</span><span>Memories</span></a>
      <a class="nav-link" data-nav="notes" href="notes.html"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4M9 11h6M9 15h6"/></svg><span>Notes</span></a>
    </div></nav>
  </div>
  <script src="assets/js/app.js"></script><script src="assets/js/notes.js"></script>
</body>
</html>
